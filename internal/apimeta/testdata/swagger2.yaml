swagger: "2.0"
info:
  title: Example Transport API
  version: "1.0"
securityDefinitions:
  basic:
    type: basic
definitions:
  Proxy:
    type: object
    required: [name]
    properties:
      name: {type: string}
      revision: {type: integer, format: int32}
paths:
  /APIProxies:
    post:
      operationId: importProxy
      parameters:
        - name: body
          in: body
          schema: {$ref: "#/definitions/Proxy"}
      responses:
        201:
          description: created
          schema: {$ref: "#/definitions/Proxy"}
    get:
      operationId: exportProxy
      parameters:
        - {name: name, in: query, type: string, required: true}
      responses:
        200: {description: ok, schema: {type: string, format: binary}}
