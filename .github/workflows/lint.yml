name: Lint

on:
  pull_request:
  push:
    branches: [master, dev]

permissions:
  contents: read

jobs:
  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  terraform-fmt:
    name: terraform fmt (examples)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Test against the minimum Terraform CLI this provider documents as
        # supporting (write-only attributes require 1.11+ — see README.md's
        # Requirements section) and the current stable release, so a
        # regression against either floor is caught here rather than only
        # discovered by a practitioner running an older or newer Terraform.
        terraform_version: ["1.11.0", "1.17.0"]
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ matrix.terraform_version }}
          terraform_wrapper: false

      - name: terraform fmt check
        run: terraform fmt -recursive -check examples/
