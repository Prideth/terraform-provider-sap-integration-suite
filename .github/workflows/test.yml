name: Test

on:
  pull_request:
  push:
    branches: [master, dev]

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go mod tidy check
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: go fmt check
        run: |
          gofmt -l .
          test -z "$(gofmt -l .)"

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        # Downloads the pinned SAP-samples files for internal/testutil/samples.
        env:
          SAP_SAMPLES_DOWNLOAD: "1"
        run: go test -race -cover ./...
