name: Acceptance Tests

# Acceptance tests exercise a real SAP Integration Suite tenant and need
# real credentials. They intentionally never run on pull_request (which
# would expose repository secrets to a forked PR); they run on demand and on
# a schedule against the tenant configured in this repository's secrets.
#
# SAP_INTEGRATION_SUITE_ACC_ALL enables every capability whose credentials
# are present (a capability without them skips with the reason) and never
# runs destructive tests. The plan step lists what runs and what skips.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  acceptance:
    name: Acceptance tests
    runs-on: ubuntu-latest
    if: github.repository == 'Prideth/terraform-provider-sap-integration-suite'
    env:
      TF_ACC: "1"
      SAP_INTEGRATION_SUITE_ACC_ALL: "1"
      SAP_INTEGRATION_SUITE_HOST: ${{ secrets.SAP_INTEGRATION_SUITE_HOST }}
      SAP_INTEGRATION_SUITE_TOKEN_URL: ${{ secrets.SAP_INTEGRATION_SUITE_TOKEN_URL }}
      SAP_INTEGRATION_SUITE_CLIENT_ID: ${{ secrets.SAP_INTEGRATION_SUITE_CLIENT_ID }}
      SAP_INTEGRATION_SUITE_CLIENT_SECRET: ${{ secrets.SAP_INTEGRATION_SUITE_CLIENT_SECRET }}
      # Optional; the API Management tests skip without them.
      SAP_INTEGRATION_SUITE_API_MANAGEMENT_HOST: ${{ secrets.SAP_INTEGRATION_SUITE_API_MANAGEMENT_HOST }}
      SAP_INTEGRATION_SUITE_API_MANAGEMENT_TOKEN_URL: ${{ secrets.SAP_INTEGRATION_SUITE_API_MANAGEMENT_TOKEN_URL }}
      SAP_INTEGRATION_SUITE_API_MANAGEMENT_CLIENT_ID: ${{ secrets.SAP_INTEGRATION_SUITE_API_MANAGEMENT_CLIENT_ID }}
      SAP_INTEGRATION_SUITE_API_MANAGEMENT_CLIENT_SECRET: ${{ secrets.SAP_INTEGRATION_SUITE_API_MANAGEMENT_CLIENT_SECRET }}
      SAP_SAMPLES_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Skip if no tenant is configured
        id: check
        run: |
          if [ -z "$SAP_INTEGRATION_SUITE_HOST" ] && [ -z "$SAP_INTEGRATION_SUITE_API_MANAGEMENT_HOST" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Acceptance plan
        if: steps.check.outputs.skip == 'false'
        run: go run ./cmd/accplan

      - name: go test (acceptance)
        if: steps.check.outputs.skip == 'false'
        run: go test -v -timeout 120m ./...

  discovery:
    name: API discovery (live contracts against the snapshots)
    runs-on: ubuntu-latest
    if: github.repository == 'Prideth/terraform-provider-sap-integration-suite'
    env:
      SAP_INTEGRATION_SUITE_HOST: ${{ secrets.SAP_INTEGRATION_SUITE_HOST }}
      SAP_INTEGRATION_SUITE_TOKEN_URL: ${{ secrets.SAP_INTEGRATION_SUITE_TOKEN_URL }}
      SAP_INTEGRATION_SUITE_CLIENT_ID: ${{ secrets.SAP_INTEGRATION_SUITE_CLIENT_ID }}
      SAP_INTEGRATION_SUITE_CLIENT_SECRET: ${{ secrets.SAP_INTEGRATION_SUITE_CLIENT_SECRET }}
      SAP_INTEGRATION_SUITE_API_MANAGEMENT_HOST: ${{ secrets.SAP_INTEGRATION_SUITE_API_MANAGEMENT_HOST }}
      SAP_INTEGRATION_SUITE_API_MANAGEMENT_TOKEN_URL: ${{ secrets.SAP_INTEGRATION_SUITE_API_MANAGEMENT_TOKEN_URL }}
      SAP_INTEGRATION_SUITE_API_MANAGEMENT_CLIENT_ID: ${{ secrets.SAP_INTEGRATION_SUITE_API_MANAGEMENT_CLIENT_ID }}
      SAP_INTEGRATION_SUITE_API_MANAGEMENT_CLIENT_SECRET: ${{ secrets.SAP_INTEGRATION_SUITE_API_MANAGEMENT_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Fails on any difference from the committed snapshots, additive ones
      # included: a new SAP entity shows up here as a failed weekly run with
      # the semantic diff in the log. Services without secrets are skipped.
      - name: Compare live contracts with the snapshots
        run: go run ./cmd/apidiscovery -fail-on additive
