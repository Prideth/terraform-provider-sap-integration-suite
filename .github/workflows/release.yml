name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v7
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      # The tagged commit must carry the finished CHANGELOG entry of its own
      # version, so that CHANGELOG.md read at the tag describes the release.
      - name: Require the CHANGELOG entry of this version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if ! grep -qE "^## ${version//./\\.} — [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section \"## ${version} — <YYYY-MM-DD>\". Move the Unreleased entries under it in a release commit and tag that commit."
            exit 1
          fi

      # Release notes are written by hand for every version. GoReleaser uses
      # the file passed with --release-notes as the release description
      # instead of a commit list.
      - name: Require release notes
        env:
          NOTES: .github/release-notes/${{ github.ref_name }}.md
        run: |
          if [ ! -s "$NOTES" ]; then
            echo "::error::$NOTES is missing or empty. Write the release notes before tagging."
            exit 1
          fi

      - uses: goreleaser/goreleaser-action@v7
        with:
          args: release --clean --release-notes .github/release-notes/${{ github.ref_name }}.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
